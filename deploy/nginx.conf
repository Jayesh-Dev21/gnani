server {
    # Cloudflare terminates TLS for this name and talks to this origin over HTTP,
    # so certificate issuance belongs to Cloudflare, not to certbot here.
    listen 80;
    listen [::]:80;
    server_name audio.example.com;

    # Everything except the ACME challenge goes to HTTPS at the edge.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 80;
    listen [::]:80;
    server_name audio.example.com;

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443;
    http2 on;
    server_name audio.example.com;

    # Cloudflare Origin CA certificate. Fullchain and key live in /etc/ssl/gnani.
    ssl_certificate     /etc/ssl/gnani/fullchain.pem;
    ssl_certificate_key /etc/ssl/gnani/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Audio can be large and transcripts are polled; do not buffer whole uploads.
    client_max_body_size 12m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }

    # Range requests must pass through untouched or seeking breaks in the player.
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
}