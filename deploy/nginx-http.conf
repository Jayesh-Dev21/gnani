# Plain-HTTP front door for the compose stack (pre-TLS phase).
# / -> frontend :3000, /api/ -> backend :8000 with the prefix preserved
# (FastAPI routes already live under /api/), = /health -> backend root.
# When a domain + Cloudflare arrive, deploy/nginx.conf (443 + origin
# certificate) replaces this file.
server {
    # default_server: AL2023 ships its own :80 server block and setup-nginx.sh
    # strips its default_server flag, leaving this as the only front door.
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Audio uploads cap at 10MB in the app; leave headroom here.
    client_max_body_size 12m;

    location = /health {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }

    # Range requests must pass through untouched or seeking breaks in the
    # player; uploads must stream, not buffer.
    #
    # Exception: /api/auth/* is Better Auth, which lives in Next.js — not in
    # FastAPI. Longest prefix wins, so this stays on the frontend while the
    # rest of /api/ goes to the backend.
    location /api/auth/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
}
