services:
  backend:
    environment:
      CORS_ORIGINS: '["http://3.111.18.213:3000"]'
  worker:
    healthcheck:
      test: ["CMD-SHELL", "for p in /proc/[0-9]*; do grep -q src.worker $$p/cmdline 2>/dev/null && exit 0; done; exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
