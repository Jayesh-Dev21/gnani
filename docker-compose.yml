name: gnani

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: audio_notes
      POSTGRES_PASSWORD: audio_notes
      POSTGRES_DB: audio_notes
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audio_notes -d audio_notes"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./app/backend
    image: gnani-backend
    restart: unless-stopped
    command:
      - sh
      - -c
      - >-
        alembic upgrade head &&
        procrastinate schema --apply &&
        uvicorn src.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips '*'
    environment:
      PYTHONPATH: /srv
      PROCRASTINATE_APP: src.queue.app
      DATABASE_URL: postgresql+asyncpg://audio_notes:audio_notes@postgres:5432/audio_notes
      DATA_DIR: /srv/data
      AUTH_JWKS_URL: http://frontend:3000/api/auth/jwks
      AUTH_AUDIENCE: ${BETTER_AUTH_URL:-http://localhost:3000}
      GNANI_API_KEY: ${GNANI_API_KEY:?set GNANI_API_KEY in .env}
      GROQ_API_KEY: ${GROQ_API_KEY:?set GROQ_API_KEY in .env}
      GROQ_MODELS: ${GROQ_MODELS:-openai/gpt-oss-120b,qwen/qwen3.8-27b,openai/gpt-oss-20b}
      LLM_MODEL_COOLDOWN_SECONDS: ${LLM_MODEL_COOLDOWN_SECONDS:-300}
      LLM_CHUNK_CHARS: ${LLM_CHUNK_CHARS:-24000}
      GNANI_MODEL: ${GNANI_MODEL:-gnani-prisma-v2.5}
      STT_REST_TIMEOUT_SECONDS: ${STT_REST_TIMEOUT_SECONDS:-90}
      STT_POLL_INTERVAL_SECONDS: ${STT_POLL_INTERVAL_SECONDS:-15}
      STT_BATCH_DEADLINE_SECONDS: ${STT_BATCH_DEADLINE_SECONDS:-900}
      WORKER_LEASE_SECONDS: ${WORKER_LEASE_SECONDS:-120}
      WORKER_HEARTBEAT_SECONDS: ${WORKER_HEARTBEAT_SECONDS:-30}
    ports:
      - "8000:8000"
    volumes:
      - audio_data:/srv/data
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: ./app/backend
    image: gnani-backend
    restart: unless-stopped
    command: ["python", "-m", "src.worker"]
    environment:
      PYTHONPATH: /srv
      DATABASE_URL: postgresql+asyncpg://audio_notes:audio_notes@postgres:5432/audio_notes
      DATA_DIR: /srv/data
      AUTH_JWKS_URL: http://frontend:3000/api/auth/jwks
      AUTH_AUDIENCE: ${BETTER_AUTH_URL:-http://localhost:3000}
      GNANI_API_KEY: ${GNANI_API_KEY:?set GNANI_API_KEY in .env}
      GROQ_API_KEY: ${GROQ_API_KEY:?set GROQ_API_KEY in .env}
      GROQ_MODELS: ${GROQ_MODELS:-openai/gpt-oss-120b,qwen/qwen3.8-27b,openai/gpt-oss-20b}
      LLM_MODEL_COOLDOWN_SECONDS: ${LLM_MODEL_COOLDOWN_SECONDS:-300}
      LLM_CHUNK_CHARS: ${LLM_CHUNK_CHARS:-24000}
      GNANI_MODEL: ${GNANI_MODEL:-gnani-prisma-v2.5}
      STT_POLL_INTERVAL_SECONDS: ${STT_POLL_INTERVAL_SECONDS:-15}
      STT_BATCH_DEADLINE_SECONDS: ${STT_BATCH_DEADLINE_SECONDS:-900}
      WORKER_LEASE_SECONDS: ${WORKER_LEASE_SECONDS:-120}
      WORKER_HEARTBEAT_SECONDS: ${WORKER_HEARTBEAT_SECONDS:-30}
    volumes:
      - audio_data:/srv/data
    depends_on:
      backend:
        condition: service_healthy

  migrate:
    build:
      context: ./app/frontend
      target: migrate
    image: gnani-frontend-migrate
    restart: "no"
    command: ["bun", "run", "db:migrate"]
    environment:
      DATABASE_URL: postgresql://audio_notes:audio_notes@postgres:5432/audio_notes
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./app/frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    image: gnani-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      DATABASE_URL: postgresql://audio_notes:audio_notes@postgres:5432/audio_notes
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  postgres_data:
  audio_data:
